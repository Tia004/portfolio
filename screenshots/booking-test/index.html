<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#111; color:#eee; font-family: -apple-system, sans-serif; margin:0; padding:24px; }
  h1 { font-size:16px; margin:0 0 16px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  figure { margin:0; }
  img { height:560px; width:auto; border-radius:12px; border:1px solid #333; }
  figcaption { font-size:12px; color:#9ca3af; margin-top:6px; }
</style>
</head>
<body>
<h1>Booking UX — mobile modal / toast / desktop panel</h1>
<div class="row">
  <figure><img src="02-mobile-booking-modal.png"><figcaption>02 — mobile booking modal (390×844)</figcaption></figure>
  <figure><img src="03-mobile-booking-toast.png"><figcaption>03 — mobile modal + "Prenotazione confermata" toast</figcaption></figure>
</div>
<div class="row">
  <figure><img src="05-desktop-booking-panel.png" style="height:480px"><figcaption>05 — desktop inline booking panel (1440×900)</figcaption></figure>
  <figure><img src="04-mobile-modal-closed.png"><figcaption>04 — modal after ESC (closed)</figcaption></figure>
</div>
</body>
</html>
